name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
          - name: Windows (MSVC)
            os: windows-2022
          - name: macOS (Clang)
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc libxcb1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vulkan-headers vulkan-loader molten-vk shaderc
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.3.296.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -Wait -ArgumentList "--root","C:\VulkanSDK\$version","--accept-licenses","--default-answer","--confirm-command","install"
          "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$version\Bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKWORLD_STANDALONE_GAMES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Every platform: export the sample (one file, and a game + pack), then load each exported game from a folder
      # with nothing of the project in it: pack, project, module code and start scene, everything but a GPU
      - name: Export check
        shell: bash
        run: |
          cd build
          VKWORLD=./vkworld; [ -f Release/vkworld.exe ] && VKWORLD=Release/vkworld.exe
          "$VKWORLD" ../examples/sample_game --export single --single-file
          "$VKWORLD" ../examples/sample_game --export packed --pack
          mkdir -p elsewhere && cd elsewhere
          for dir in single packed; do
            game="../$dir/Sample Game"
            [ -f "$game.exe" ] && game="$game.exe"
            [ -d "$game.app" ] && game="$game.app/Contents/MacOS/Sample Game"
            "$game" --check
          done
          if [ "$RUNNER_OS" = "macOS" ]; then test -f "../single/Sample Game.app/Contents/Resources/icon.icns"; fi

      - name: Show DLL dependencies (Windows, after a failure)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          Get-ChildItem build/Release
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          & $dumpbin.FullName /dependents build/Release/engine_tests.exe build/Release/engine.dll

      # Linux: run the programs for real on a software Vulkan driver (lavapipe) under a virtual X server, with the
      # validation layer (synchronisation checks too): any validation error or a blank frame fails the build
      - name: Smoke test (Linux, software Vulkan)
        if: runner.os == 'Linux'
        env:
          VKWORLD_VALIDATION: "1"
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "true"
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
          cd build
          XVFB="xvfb-run -a -s '-screen 0 1280x720x24'"
          eval $XVFB ./vkgame --screenshot smoke-game.png --frames 30
          eval $XVFB ./vkworld --stress --play --screenshot smoke-editor.png --frames 20
          # (the exports from the step before: run them for real)
          cd elsewhere
          eval $XVFB "'../single/Sample Game'" --screenshot ../smoke-single.png --frames 30
          eval $XVFB "'../packed/Sample Game'" --screenshot ../smoke-packed.png --frames 30
          cd ..
          python3 ../tools/check_screenshot.py smoke-game.png smoke-editor.png smoke-single.png smoke-packed.png

      # (No smoke test on macOS: the runners' paravirtual GPU lacks Metal argument encoders, and MoltenVK aborts
      # in vkCreateInstance. Windows runners have no Vulkan driver at all.)

      - name: Upload smoke test screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ runner.os }}
          path: build/smoke-*.png
          if-no-files-found: ignore
